<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Employee Dashboard</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/custom.css?v=20251103}">
</head>

<body class="bg-light page-employee">

<div class="container py-5">

    <!-- Header -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="mb-0">Employee Dashboard</h1>

        <form th:action="@{/logout}" method="post">
            <input type="hidden"
                   th:name="${_csrf.parameterName}"
                   th:value="${_csrf.token}"/>

            <button type="submit"
                    class="btn btn-outline-danger btn-sm confirm-logout">
                Log Out
            </button>
        </form>
    </div>

    <!-- Welcome -->
    <div class="card shadow-sm mb-4">
        <div class="card-body">
            <h4 class="mb-2">Welcome!</h4>
            <p class="text-muted mb-0">
                View your upcoming shifts and manage your work hours.
            </p>
        </div>
    </div>

    <!-- Schedule -->
    <div class="card shadow-sm mb-4">
        <div class="card-body">
            <h4 class="mb-3">My Schedule</h4>

            <p class="text-muted mb-0">
                Your scheduled shifts will appear here.
            </p>
        </div>
    </div>

    <!-- Time Tracking -->
    <div class="card shadow-sm mb-4">
        <div class="card-body">
            <h4 class="mb-3">Time Tracking</h4>

            <p class="text-muted mb-0">
                Clock-in and clock-out functionality will appear here.
            </p>
        </div>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/custom.js?v=20260915}"></script>

</body>
</html>
