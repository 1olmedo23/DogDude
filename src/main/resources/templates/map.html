<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Map - Fremont Dog Plaza</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/custom.css?v=20251103}">
</head>

<body class="bg-light page-map">
<div th:replace="~{fragments/navbar :: navbar('map')}"></div>

<main class="container-fluid py-4">

    <!-- Page header -->
    <div class="text-center mb-3">
        <h1 class="h4 mb-2">Map</h1>

        <h5 class="text-muted mx-auto" style="max-width: 900px;">
            Dear customer, please avoid breaking any traffic laws when coming and going from Fremont Dog Plaza.
            You are welcome to drive on the Stay Safe Street with your car. However, please be aware, pedestrians
            and cyclists have the right of way.
        </h5>
    </div>

    <!-- Link row (above image, right aligned) -->
    <div class="d-flex justify-content-end mb-2">
        <a class="map-link"
           href="https://www.google.com/maps?q=10506+Fremont+Ave+N,+Seattle,+WA+98133"
           target="_blank"
           rel="noopener noreferrer">
            📍 Open in Google Maps
        </a>
    </div>

    <!-- Big image frame -->
    <div class="map-frame shadow-sm">
        <img class="map-img"
             th:src="@{/images/street-map.png}"
             alt="Map showing the location of Fremont Dog Plaza">
    </div>

</main>

<script th:src="@{/js/custom.js?v=20251103}"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
